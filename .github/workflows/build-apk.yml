name: Build debug APK

# Builds two APKs on every push so they can be downloaded from the GitHub website:
# Actions tab -> latest run -> "Artifacts" section at the bottom:
#   app-debug   = debug build (slower, for development)
#   app-release = optimised build (smooth, use this one to judge real performance)
#
# Every build on main is also published as a GitHub Release named "latest", with plain APK files
# (no zip): NetPulse.apk (optimised) and NetPulse-debug.apk. Stable download link:
#   https://github.com/ayushgohil/Internet-Speed-Tracker-App/releases/latest/download/NetPulse.apk
on:
  push:
  workflow_dispatch:   # also lets you run it manually from the Actions tab

permissions:
  contents: write      # needed to publish the "latest" release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      # gradle.properties pins a Windows JDK path for local builds; it doesn't exist on this runner.
      # This only edits the temporary checkout, not the repository.
      - name: Use the runner's JDK instead of the Windows path
        run: sed -i '/^org.gradle.java.home=/d' gradle.properties

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug and release APKs
        run: ./gradlew assembleDebug assembleRelease --stacktrace

      # Informational: prints the key the APK is signed with. It should be identical on every build.
      - name: Show APK signing certificate
        continue-on-error: true
        run: |
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          for apk in app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/release/app-release.apk; do
            echo "== $apk"
            "$APKSIGNER" verify --print-certs "$apk"
          done

      # Informational: facts that decide whether a phone will accept the APK (package, version,
      # minimum Android, debuggable flag, signature schemes, zip integrity).
      - name: Inspect APKs
        continue-on-error: true
        run: |
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          for apk in app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/release/app-release.apk; do
            echo "=================== $apk"
            ls -l "$apk"
            echo "-- zip test:"; unzip -tq "$apk" | tail -1
            echo "-- manifest facts:"
            "$BT/aapt2" dump badging "$apk" | grep -E "^package:|^application-label:|^sdkVersion|^targetSdkVersion|^application-debuggable|^native-code|^launchable-activity" || true
            echo "-- key files in the APK:"
            unzip -l "$apk" | grep -E "AndroidManifest.xml|classes[0-9]*.dex|resources.arsc" || true
            echo "-- signature verification:"
            "$BT/apksigner" verify -v "$apk" | grep -E "^Verifies|^Verified using|^Number of signers" || true
          done

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      # Publishes plain APK files (no zip) on a release named "latest", replacing the previous one.
      # Download link for the optimised app:
      #   https://github.com/ayushgohil/Internet-Speed-Tracker-App/releases/latest/download/NetPulse.apk
      - name: Publish latest release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release-files
          cp app/build/outputs/apk/release/app-release.apk release-files/NetPulse.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-files/NetPulse-debug.apk
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest release-files/NetPulse.apk release-files/NetPulse-debug.apk \
            --target "$GITHUB_SHA" \
            --title "NetPulse (latest build)" \
            --notes "Built from commit ${GITHUB_SHA::7}. NetPulse.apk is the optimised build, NetPulse-debug.apk is the debug build." \
            --latest
